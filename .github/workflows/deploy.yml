# Builds and deploys the site to GitHub Pages.
#
# Runs on every push to main, once a day (so star counts and PR totals stay
# fresh without a commit), and on demand from the Actions tab.
#
# One-time setup: Settings -> Pages -> "Build and deployment" -> Source must be
# "GitHub Actions" (not "Deploy from a branch"), otherwise this deploy is ignored.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:

# Only what Pages deployment needs. secrets.GITHUB_TOKEN inherits these.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer run cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetches merged-PR data from the GitHub API and writes it into the HTML.
      # Falls back to the committed data/open-source.json if the API fails.
      # The automatic GITHUB_TOKEN is enough: it can read public data and lifts
      # the search rate limit from 10 to 30 requests per minute.
      - name: Fetch open-source data and render pages
        run: python3 scripts/fetch_open_source.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      # The whole repo is the site: it is plain HTML with no build output dir.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
